<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seite nicht gefunden – GenZ Dev</title>
  <meta name="robots" content="noindex">
  <!-- Pfade beginnen mit /, weil der Server diese Seite unter jeder beliebigen Adresse ausliefert -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <style>
    .notfound { min-height: calc(100vh - 72px); min-height: calc(100svh - 72px); display: grid; align-content: center; justify-items: center; gap: 0; padding-block: 64px; text-align: center; }
    .notfound .code { font-size: clamp(4.5rem, 16vw, 8rem); font-weight: 700; line-height: 1; letter-spacing: -0.04em; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .notfound h1 { margin-top: 16px; font-size: clamp(1.75rem, 4vw, 2.5rem); }
    .notfound .lead { margin-top: 12px; max-width: 46ch; }
    .notfound .en { margin-top: 28px; color: var(--muted); font-size: 0.9375rem; }
    .notfound .hero-actions { margin-top: 32px; }
  </style>
</head>
<body class="theme-dark">
  <header class="site-header theme-dark">
    <div class="container header-inner">
      <a class="logo" href="/" aria-label="GenZ Dev – zur Startseite">
        <img class="logo-mark" src="/assets/logo-mark.svg" alt="" width="46" height="29">
        <span>GenZ Dev</span>
      </a>
    </div>
  </header>
  <main class="container notfound">
    <p class="code" aria-hidden="true">404</p>
    <h1>Diese Seite gibt es nicht.</h1>
    <p class="lead">Vielleicht hat sich die Adresse geändert oder ein Tippfehler hat sich eingeschlichen.</p>
    <div class="hero-actions">
      <a class="btn btn-primary" href="/">Zur Startseite</a>
      <a class="btn btn-ghost" href="/#kontakt">Kontakt aufnehmen</a>
    </div>
    <p class="en" lang="en">Page not found. <a href="/en/">Go to the English homepage</a>.</p>
  </main>
</body>
</html>
